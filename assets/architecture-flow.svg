<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Frame Background -->
  <rect width="1200" height="480" rx="14" fill="url(#flowBg)"/>
  <rect x="1" y="1" width="1198" height="478" rx="13" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(36, 24)">
    <text x="0" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">
      Product Operations Lifecycle &amp; Artifact Architecture
    </text>
    <text x="0" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      Traces empirical GitHub audit telemetry into simulated agile sprint execution and production release gates
    </text>
  </g>

  <!-- Subgraph A: Real Empirical Telemetry (Left) -->
  <g transform="translate(36, 85)">
    <rect width="350" height="360" rx="10" fill="url(#cardA)" stroke="#059669" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect width="350" height="3" rx="1.5" fill="#10b981"/>
    <text x="18" y="28" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
      PART A: REAL EMPIRICAL TELEMETRY
    </text>

    <!-- Node A1: GitHub API Data -->
    <g transform="translate(20, 48)">
      <rect width="310" height="60" rx="8" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="1"/>
      <circle cx="20" cy="30" r="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="16" y="34" fill="#34d399" font-size="12">✦</text>
      <text x="42" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">GitHub API Telemetry</text>
      <text x="42" y="44" fill="#94a3b8" font-family="monospace" font-size="11">metabase/metabase (200 records)</text>
    </g>

    <!-- Arrow Down -->
    <line x1="175" y1="108" x2="175" y2="128" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Node A2: SQLite Engine -->
    <g transform="translate(20, 130)">
      <rect width="310" height="60" rx="8" fill="url(#nodeGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">SQLite Metrics Engine</text>
      <text x="20" y="44" fill="#38bdf8" font-family="monospace" font-size="11">scripts/build_metrics.py</text>
    </g>

    <!-- Arrow Down -->
    <line x1="175" y1="190" x2="175" y2="210" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Node A3: Audit Findings & Market -->
    <g transform="translate(20, 212)">
      <rect width="310" height="124" rx="8" fill="url(#nodeGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Audit Findings &amp; Market Matrix</text>
      <text x="20" y="46" fill="#cbd5e1" font-family="monospace" font-size="11">📁 02-audit/backlog-health.md</text>
      <text x="20" y="66" fill="#cbd5e1" font-family="monospace" font-size="11">📁 02-audit/triage-speed.md</text>
      <text x="20" y="86" fill="#cbd5e1" font-family="monospace" font-size="11">📁 02-audit/release-cadence.md</text>
      <text x="20" y="106" fill="#94a3b8" font-family="monospace" font-size="11">📁 03-market/competitor-table.md</text>
    </g>
  </g>

  <!-- Big Connecting Arrow A -> B -->
  <path d="M 386 330 L 415 330" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Subgraph B: Product Strategy & Agile Delivery (Center) -->
  <g transform="translate(425, 85)">
    <rect width="350" height="360" rx="10" fill="url(#cardB)" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect width="350" height="3" rx="1.5" fill="#38bdf8"/>
    <text x="18" y="28" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
      PART B: PRODUCT &amp; AGILE DELIVERY
    </text>

    <!-- Node B1: PRD -->
    <g transform="translate(20, 48)">
      <rect width="310" height="60" rx="8" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1"/>
      <text x="20" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">PRD: Release Health Assistant</text>
      <text x="20" y="44" fill="#38bdf8" font-family="monospace" font-size="11">04-requirements/PRD-release-health...</text>
    </g>

    <!-- Arrow Down -->
    <line x1="175" y1="108" x2="175" y2="128" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Node B2: Backlog & Jira -->
    <g transform="translate(20, 130)">
      <rect width="310" height="60" rx="8" fill="url(#nodeGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Backlog &amp; Gherkin Story Specs</text>
      <text x="20" y="44" fill="#94a3b8" font-family="monospace" font-size="11">04-requirements/backlog.csv (64 pts)</text>
    </g>

    <!-- Arrow Down -->
    <line x1="175" y1="190" x2="175" y2="210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Node B3: 3 Simulated Sprints -->
    <g transform="translate(20, 212)">
      <rect width="310" height="124" rx="8" fill="url(#nodeGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">3 Simulated Agile Sprints</text>
      <text x="20" y="46" fill="#cbd5e1" font-family="monospace" font-size="11">🏃 Sprint 1: Triage SLA (19 pts)</text>
      <text x="20" y="66" fill="#cbd5e1" font-family="monospace" font-size="11">🏃 Sprint 2: Release Gate (21 pts)</text>
      <text x="20" y="86" fill="#cbd5e1" font-family="monospace" font-size="11">🏃 Sprint 3: Readiness UI (24 pts)</text>
      <text x="20" y="106" fill="#4ade80" font-family="monospace" font-size="11">📊 100% Predictability (64/64 pts)</text>
    </g>
  </g>

  <!-- Big Connecting Arrow B -> C -->
  <path d="M 775 330 L 804 330" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- Subgraph C: Release Operations & Launch (Right) -->
  <g transform="translate(814, 85)">
    <rect width="350" height="360" rx="10" fill="url(#cardC)" stroke="#9333ea" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect width="350" height="3" rx="1.5" fill="#c084fc"/>
    <text x="18" y="28" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
      PART C: OPERATIONS &amp; LAUNCH
    </text>

    <!-- Node C1: Release Documentation -->
    <g transform="translate(20, 48)">
      <rect width="310" height="85" rx="8" fill="url(#nodeGrad)" stroke="#c084fc" stroke-width="1"/>
      <text x="20" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Release Documentation (v1.0.0)</text>
      <text x="20" y="44" fill="#cbd5e1" font-family="monospace" font-size="11">📄 06-docs/release-notes.md</text>
      <text x="20" y="64" fill="#cbd5e1" font-family="monospace" font-size="11">📚 06-docs/feature-library.md</text>
    </g>

    <!-- Arrow Down -->
    <line x1="175" y1="133" x2="175" y2="153" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>

    <!-- Node C2: Go/No-Go Gate -->
    <g transform="translate(20, 155)">
      <rect width="310" height="85" rx="8" fill="url(#nodeGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Go/No-Go Readiness Gate</text>
      <text x="20" y="44" fill="#cbd5e1" font-family="monospace" font-size="11">🚦 06-docs/readiness-checklist.md</text>
      <text x="20" y="64" fill="#4ade80" font-family="monospace" font-size="11">✔ 0 P1 Bugs · 10/10 Parity · Signed</text>
    </g>

    <!-- Arrow Down -->
    <line x1="175" y1="240" x2="175" y2="260" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>

    <!-- Node C3: Launch & Pilot -->
    <g transform="translate(20, 262)">
      <rect width="310" height="74" rx="8" fill="url(#nodeGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Pilot Rollout &amp; Live Demo</text>
      <text x="20" y="44" fill="#cbd5e1" font-family="monospace" font-size="11">🚀 07-launch/pilot-plan.md</text>
      <text x="20" y="62" fill="#cbd5e1" font-family="monospace" font-size="11">🎙️ 07-launch/demo-script.md</text>
    </g>
  </g>
</svg>
