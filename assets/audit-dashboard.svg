<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="unassignedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="1200" height="480" rx="14" fill="url(#dbBg)"/>
  <rect x="1" y="1" width="1198" height="478" rx="13" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Navigation / Header inside Dashboard -->
  <g transform="translate(30, 24)">
    <text x="0" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">
      Metabase Production Operations Audit Telemetry
    </text>
    <text x="0" y="42" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      Live sample: 200 issues, 200 milestones, 200 releases · GitHub REST API (v3)
    </text>

    <!-- Source Status Badge -->
    <rect x="990" y="6" width="150" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="1006" cy="20" r="4" fill="#34d399"/>
    <text x="1018" y="24" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">VERIFIED METRICS</text>
  </g>

  <!-- Panel 1: Priority Distribution Bar Breakdown (Left) -->
  <g transform="translate(30, 90)">
    <rect width="550" height="350" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="24" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">
      Open Backlog Prioritization Distribution
    </text>
    <text x="24" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      Sample of 152 open issues (94.7% prioritization coverage)
    </text>

    <!-- Priority Bar P3 -->
    <g transform="translate(24, 80)">
      <text x="0" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Priority P3 (Minor / Workaround)</text>
      <text x="440" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">61.2% (93)</text>
      <rect x="0" y="24" width="490" height="14" rx="7" fill="#0f172a"/>
      <rect x="0" y="24" width="300" height="14" rx="7" fill="url(#p3Grad)"/>
    </g>

    <!-- Priority Bar P2 -->
    <g transform="translate(24, 140)">
      <text x="0" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Priority P2 (Major Functional Defect)</text>
      <text x="440" y="16" fill="#f97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">27.0% (41)</text>
      <rect x="0" y="24" width="490" height="14" rx="7" fill="#0f172a"/>
      <rect x="0" y="24" width="132" height="14" rx="7" fill="url(#p2Grad)"/>
    </g>

    <!-- Priority Bar P1 -->
    <g transform="translate(24, 200)">
      <text x="0" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Priority P1 (Crashing / Security / Correctness)</text>
      <text x="440" y="16" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">6.6% (10)</text>
      <rect x="0" y="24" width="490" height="14" rx="7" fill="#0f172a"/>
      <rect x="0" y="24" width="33" height="14" rx="7" fill="url(#p1Grad)"/>
    </g>

    <!-- Priority Bar Unassigned -->
    <g transform="translate(24, 260)">
      <text x="0" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Unassigned Priority</text>
      <text x="440" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">5.3% (8)</text>
      <rect x="0" y="24" width="490" height="14" rx="7" fill="#0f172a"/>
      <rect x="0" y="24" width="26" height="14" rx="7" fill="url(#unassignedGrad)"/>
    </g>
  </g>

  <!-- Panel 2: Cycle Time & Release Cadence (Right) -->
  <g transform="translate(610, 90)">
    <rect width="560" height="350" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="24" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">
      Resolution Velocity &amp; Release Cadence
    </text>
    <text x="24" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      Average days to close by priority tier &amp; deployment intervals
    </text>

    <!-- Metric comparison cards inside right panel -->
    <g transform="translate(24, 75)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="245" height="100" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">P1 RESOLUTION SPEED</text>
      <text x="16" y="64" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">4.1 Days</text>
      <text x="16" y="86" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Rapid security/crash patches</text>

      <!-- Box 2 -->
      <rect x="265" y="0" width="245" height="100" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="281" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">P2 RESOLUTION SPEED</text>
      <text x="281" y="64" fill="#f97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">9.3 Days</text>
      <text x="281" y="86" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">2.3x longer due to cross-team bugs</text>
    </g>

    <!-- Visual timeline for release cadence -->
    <g transform="translate(24, 195)">
      <rect x="0" y="0" width="510" height="120" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">GENERAL AVAILABILITY CADENCE</text>
      <text x="16" y="64" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">Every 2.7 Days</text>
      <text x="210" y="62" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Multi-branch patch stream</text>

      <!-- Timeline Dots -->
      <line x1="20" y1="95" x2="480" y2="95" stroke="#334155" stroke-width="2"/>
      <circle cx="60" cy="95" r="5" fill="#38bdf8"/>
      <text x="40" y="112" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">v0.64.0</text>
      <circle cx="180" cy="95" r="5" fill="#34d399"/>
      <text x="160" y="112" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">v0.64.1</text>
      <circle cx="320" cy="95" r="5" fill="#34d399"/>
      <text x="300" y="112" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">v0.63.19</text>
      <circle cx="440" cy="95" r="5" fill="#38bdf8"/>
      <text x="420" y="112" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">v0.65.0-b</text>
    </g>
  </g>
</svg>
