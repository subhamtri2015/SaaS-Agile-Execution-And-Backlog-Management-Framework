<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Glowing Accent Line at Top -->
  <rect x="60" y="0" width="1080" height="3" fill="url(#primaryGlow)" filter="url(#glow)"/>

  <!-- Top Badges -->
  <g transform="translate(60, 36)">
    <rect x="0" y="0" width="168" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#38bdf8"/>
    <text x="26" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">METABASE AUDIT</text>

    <rect x="180" y="0" width="160" height="26" rx="13" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
    <circle cx="194" cy="13" r="4" fill="#4ade80"/>
    <text x="206" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">REAL GITHUB DATA</text>

    <rect x="352" y="0" width="190" height="26" rx="13" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <circle cx="366" cy="13" r="4" fill="#a855f7"/>
    <text x="378" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">RELEASE HEALTH ASST</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="112" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    From Issue Tracker to Release Notes
  </text>
  <text x="60" y="146" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    A B2B SaaS Product Operations Audit &amp; Automated Release Governance Pipeline
  </text>

  <!-- Three Hero KPI Stat Cards on the Right / Lower portion -->
  <g transform="translate(60, 180)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="3" rx="1.5" fill="url(#accentAmber)"/>
    <text x="20" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="1">TRIAGE BACKLOG DEBT</text>
    <text x="20" y="74" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800">77.6%</text>
    <text x="135" y="72" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">of open issues</text>
    <text x="20" y="104" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">118/152 tagged .Needs Triage</text>
    <circle cx="304" cy="40" r="14" fill="#f59e0b" fill-opacity="0.15"/>
    <path d="M304 33 L304 41 M304 45 L304 47" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

    <!-- Card 2 -->
    <rect x="370" y="0" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="370" y="0" width="340" height="3" rx="1.5" fill="url(#accentCyan)"/>
    <text x="390" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="1">PRIORITIZATION COVERAGE</text>
    <text x="390" y="74" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800">94.7%</text>
    <text x="510" y="72" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">prioritized</text>
    <text x="390" y="104" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">P1-P4 tags; P3 accounts for 61.2%</text>
    <circle cx="674" cy="40" r="14" fill="#38bdf8" fill-opacity="0.15"/>
    <path d="M668 40 L672 44 L680 36" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Card 3 -->
    <rect x="740" y="0" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="740" y="0" width="340" height="3" rx="1.5" fill="url(#accentGreen)"/>
    <text x="760" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="1">RELEASE FREQUENCY</text>
    <text x="760" y="74" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800">2.7 Days</text>
    <text x="880" y="72" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">average cadence</text>
    <text x="760" y="104" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">25 GA releases; 100% milestone match</text>
    <circle cx="1044" cy="40" r="14" fill="#4ade80" fill-opacity="0.15"/>
    <path d="M1038 40 L1043 45 L1051 35" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
