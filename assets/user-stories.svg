<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Release Health Assistant user stories</title>
  <desc id="desc">Three proposed, unbuilt user stories from the RHA PRD: triage monitoring, milestone parity review, and release readiness.</desc>
  <rect width="1200" height="500" fill="#ffffff"/>
  <g font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif" fill="#1f2937">
    <text x="28" y="42" font-size="24" font-weight="700">User stories &amp; acceptance criteria</text>
    <text x="28" y="68" font-size="13" fill="#4b5563">Proposed design (not built) · Stories summarized from the portfolio PRD</text>
    <rect x="963" y="24" width="212" height="34" rx="17" fill="#eff6ff" stroke="#2563eb"/>
    <text x="1069" y="46" font-size="13" text-anchor="middle" font-weight="700" fill="#1d4ed8">PROPOSED DESIGN</text>

    <g>
      <rect x="28" y="96" width="364" height="350" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
      <rect x="28" y="96" width="364" height="8" rx="4" fill="#ea580c"/>
      <text x="52" y="137" font-size="13" font-weight="700" fill="#9a3412">EPIC 1 · TRIAGE TARGET</text>
      <text x="52" y="174" font-size="21" font-weight="700">RHA-101 · Must · 5 pts</text>
      <text x="52" y="210" font-size="14">
        <tspan x="52">As a Product Ops Lead, I want a</tspan>
        <tspan x="52" dy="21">daily scan for `.Needs Triage` issues</tspan>
        <tspan x="52" dy="21">older than 72 hours, so stale work is</tspan>
        <tspan x="52" dy="21">flagged for human review.</tspan>
      </text>
      <line x1="52" y1="310" x2="368" y2="310" stroke="#fed7aa"/>
      <text x="52" y="338" font-size="12" font-weight="700" fill="#9a3412">ACCEPTANCE CHECK</text>
      <text x="52" y="365" font-size="13">
        <tspan x="52">Given an open issue is over 72h and</tspan>
        <tspan x="52" dy="19">has `.Needs Triage`, the daily scan</tspan>
        <tspan x="52" dy="19">flags it and includes it in a Slack digest.</tspan>
      </text>
    </g>

    <g>
      <rect x="418" y="96" width="364" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect x="418" y="96" width="364" height="8" rx="4" fill="#2563eb"/>
      <text x="442" y="137" font-size="13" font-weight="700" fill="#1d4ed8">EPIC 2 · CHANGELOG PARITY</text>
      <text x="442" y="174" font-size="21" font-weight="700">RHA-201 · Must · 5 pts</text>
      <text x="442" y="210" font-size="14">
        <tspan x="442">As a Release Manager, I want the</tspan>
        <tspan x="442" dy="21">closed issues for a release milestone</tspan>
        <tspan x="442" dy="21">collected, so I can compare scope</tspan>
        <tspan x="442" dy="21">against draft release notes.</tspan>
      </text>
      <line x1="442" y1="310" x2="758" y2="310" stroke="#bfdbfe"/>
      <text x="442" y="338" font-size="12" font-weight="700" fill="#1d4ed8">ACCEPTANCE CHECK</text>
      <text x="442" y="365" font-size="13">
        <tspan x="442">Given a milestone is selected, return</tspan>
        <tspan x="442" dy="19">its closed issues with IDs and states;</tspan>
        <tspan x="442" dy="19">preserve transferred/reopened status.</tspan>
      </text>
    </g>

    <g>
      <rect x="808" y="96" width="364" height="350" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect x="808" y="96" width="364" height="8" rx="4" fill="#16a34a"/>
      <text x="832" y="137" font-size="13" font-weight="700" fill="#166534">EPIC 3 · RELEASE READINESS</text>
      <text x="832" y="174" font-size="21" font-weight="700">RHA-301 · Must · 8 pts</text>
      <text x="832" y="210" font-size="14">
        <tspan x="832">As a Release Manager, I want one</tspan>
        <tspan x="832" dy="21">view of blockers, test evidence, and</tspan>
        <tspan x="832" dy="21">parity, so decisions use a consistent</tspan>
        <tspan x="832" dy="21">readiness checklist.</tspan>
      </text>
      <line x1="832" y1="310" x2="1148" y2="310" stroke="#bbf7d0"/>
      <text x="832" y="338" font-size="12" font-weight="700" fill="#166534">ACCEPTANCE CHECK</text>
      <text x="832" y="365" font-size="13">
        <tspan x="832">If a required check is missing or a</tspan>
        <tspan x="832" dy="19">P1 remains open, report No-Go and</tspan>
        <tspan x="832" dy="19">identify the failed checks.</tspan>
      </text>
    </g>
    <text x="28" y="478" font-size="12" fill="#6b7280">These are proposed requirements, not evidence of implemented or tested behavior. Full ACs: 04-requirements/PRD-release-health-assistant.md</text>
  </g>
</svg>
