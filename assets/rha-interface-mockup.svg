<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <linearGradient id="uiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="portalCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="topNav" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="1200" height="460" rx="14" fill="url(#uiBg)"/>
  <rect x="1" y="1" width="1198" height="458" rx="13" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Browser/App Chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="14" fill="url(#topNav)"/>
  <!-- Traffic Light Dots -->
  <circle cx="24" cy="22" r="6" fill="#ef4444"/>
  <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="22" r="6" fill="#10b981"/>

  <!-- Browser URL Bar -->
  <rect x="120" y="8" width="460" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="140" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
    https://release-health.internal.net/portal/release/v1.0.0
  </text>

  <!-- Status Chip -->
  <rect x="1000" y="9" width="170" height="26" rx="13" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <circle cx="1016" cy="22" r="4" fill="#4ade80"/>
  <text x="1028" y="26" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">RELEASE GATE: GO</text>

  <!-- Main Content Layout (3 Cards representing the 3 views) -->
  <g transform="translate(30, 65)">
    <!-- Column 1: Triage SLA Monitor -->
    <rect x="0" y="0" width="360" height="365" rx="10" fill="url(#portalCard)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">1. Triage SLA Monitor</text>
    <text x="20" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Daily scan · .Needs Triage &gt; 72h</text>

    <!-- Alert Item 1 -->
    <g transform="translate(16, 70)">
      <rect width="328" height="68" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="16" cy="20" r="4" fill="#f59e0b"/>
      <text x="28" y="23" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">SLA BREACH (76h)</text>
      <text x="28" y="42" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">#84169: Dashboard tab URL slugs...</text>
      <text x="28" y="58" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Routed to: #team-uxwest · P3</text>
    </g>

    <!-- Alert Item 2 -->
    <g transform="translate(16, 148)">
      <rect width="328" height="68" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
      <circle cx="16" cy="20" r="4" fill="#ef4444"/>
      <text x="28" y="23" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">CRITICAL CRASHER HEURISTIC</text>
      <text x="28" y="42" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">#83595: Embedded question rerun...</text>
      <text x="28" y="58" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Escalated: Priority P1 Recommended</text>
    </g>

    <!-- Ingestion Stats -->
    <g transform="translate(16, 226)">
      <rect width="328" height="115" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">TRIAGE REDUCTION PROGRESS</text>
      <text x="16" y="60" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">-81.7%</text>
      <text x="135" y="56" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">triage backlog debt</text>
      <text x="16" y="94" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">77.6% (baseline) → 14.2% (pilot)</text>
    </g>

    <!-- Column 2: Parity Validator -->
    <rect x="390" y="0" width="360" height="365" rx="10" fill="url(#portalCard)" stroke="#334155" stroke-width="1"/>
    <text x="410" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">2. Milestone Parity Validator</text>
    <text x="410" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Closed issues vs. Draft release notes</text>

    <!-- Parity Status Box -->
    <g transform="translate(406, 70)">
      <rect width="328" height="78" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="16" y="28" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">100% PARITY CONFIRMED</text>
      <text x="16" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">10 / 10 Issues Matched</text>
      <text x="16" y="66" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Zero undocumented bug fixes or pull requests</text>
    </g>

    <!-- Ticket match list -->
    <g transform="translate(406, 160)">
      <rect width="328" height="180" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">VERIFIED CHANGELOG TICKETS</text>

      <text x="16" y="50" fill="#4ade80" font-size="11">✔</text>
      <text x="32" y="50" fill="#e2e8f0" font-size="11" font-family="sans-serif">RHA-101: Triage SLA Scanner</text>

      <text x="16" y="78" fill="#4ade80" font-size="11">✔</text>
      <text x="32" y="78" fill="#e2e8f0" font-size="11" font-family="sans-serif">RHA-102: Slack Webhook Alerts</text>

      <text x="16" y="106" fill="#4ade80" font-size="11">✔</text>
      <text x="32" y="106" fill="#e2e8f0" font-size="11" font-family="sans-serif">RHA-202: Markdown Notes Parser</text>

      <text x="16" y="134" fill="#4ade80" font-size="11">✔</text>
      <text x="32" y="134" fill="#e2e8f0" font-size="11" font-family="sans-serif">RHA-203: Parity Diff Engine</text>

      <text x="16" y="162" fill="#4ade80" font-size="11">✔</text>
      <text x="32" y="162" fill="#e2e8f0" font-size="11" font-family="sans-serif">RHA-301: Go/No-Go Readiness UI</text>
    </g>

    <!-- Column 3: Go/No-Go Gate & Sign-Offs -->
    <rect x="780" y="0" width="360" height="365" rx="10" fill="url(#portalCard)" stroke="#334155" stroke-width="1"/>
    <text x="800" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">3. Go/No-Go Release Gate</text>
    <text x="800" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Automated checks &amp; digital sign-offs</text>

    <!-- Sign-off checks -->
    <g transform="translate(796, 70)">
      <!-- Check 1 -->
      <rect width="328" height="42" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#22c55e"/>
      <text x="35" y="25" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="600">Open P1 Bugs: 0 (PASSED)</text>

      <!-- Check 2 -->
      <rect y="48" width="328" height="42" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
      <circle cx="20" cy="69" r="5" fill="#22c55e"/>
      <text x="35" y="73" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="600">E2E Tests: 42/42 Passed (100%)</text>

      <!-- Check 3 -->
      <rect y="96" width="328" height="42" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
      <circle cx="20" cy="117" r="5" fill="#22c55e"/>
      <text x="35" y="121" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="600">QA Lead Sign-off: S. Jenkins</text>

      <!-- Check 4 -->
      <rect y="144" width="328" height="42" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
      <circle cx="20" cy="165" r="5" fill="#22c55e"/>
      <text x="35" y="169" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="600">Eng Lead Sign-off: D. Chen</text>

      <!-- Check 5 -->
      <rect y="192" width="328" height="42" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
      <circle cx="20" cy="213" r="5" fill="#22c55e"/>
      <text x="35" y="217" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="600">Product Ops Sign-off: A. Taylor</text>

      <!-- Final Action Button: Active Green -->
      <rect y="246" width="328" height="48" rx="8" fill="#16a34a"/>
      <text x="96" y="276" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🚀 PROMOTE TO GA</text>
    </g>
  </g>
</svg>
