<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="jiraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="columnBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="storyTag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="1200" height="500" rx="14" fill="url(#jiraBg)"/>
  <rect x="1" y="1" width="1198" height="498" rx="13" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Jira Header -->
  <g transform="translate(30, 24)">
    <!-- Jira Logo Badge -->
    <rect x="0" y="0" width="32" height="32" rx="6" fill="#0052cc"/>
    <path d="M16 8 L22 14 L16 20 L10 14 Z" fill="#ffffff"/>
    <path d="M16 14 L22 20 L16 26 L10 20 Z" fill="#ffffff" opacity="0.7"/>

    <text x="44" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">
      Jira Sprint Delivery Board &amp; Burndown
    </text>
    <text x="430" y="21" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
      [SIMULATED AGILE CYCLE · 64 PTS TOTAL]
    </text>

    <!-- Sprint Badge -->
    <rect x="980" y="4" width="160" height="26" rx="13" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="996" cy="17" r="4" fill="#3b82f6"/>
    <text x="1008" y="21" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">SPRINT 3: COMPLETE</text>
  </g>

  <!-- Left: Jira Kanban Board Columns -->
  <g transform="translate(30, 75)">
    <!-- Column: TO DO -->
    <rect x="0" y="0" width="165" height="395" rx="8" fill="url(#columnBg)" stroke="#334155" stroke-width="1"/>
    <text x="14" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">TO DO (0)</text>

    <!-- Column: IN PROGRESS -->
    <rect x="180" y="0" width="165" height="395" rx="8" fill="url(#columnBg)" stroke="#334155" stroke-width="1"/>
    <text x="194" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">IN PROGRESS (0)</text>

    <!-- Column: IN REVIEW -->
    <rect x="360" y="0" width="165" height="395" rx="8" fill="url(#columnBg)" stroke="#334155" stroke-width="1"/>
    <text x="374" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">IN REVIEW (0)</text>

    <!-- Column: DONE (Active with tickets) -->
    <rect x="540" y="0" width="220" height="395" rx="8" fill="url(#columnBg)" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="540" y="0" width="220" height="4" rx="2" fill="#22c55e"/>
    <text x="554" y="26" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">DONE (24 PTS / 100%)</text>

    <!-- Ticket 1 in DONE -->
    <g transform="translate(550, 42)">
      <rect width="200" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">RHA-301</text>
      <rect x="168" y="8" width="22" height="16" rx="3" fill="#1e293b"/>
      <text x="174" y="20" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">8</text>
      <text x="10" y="38" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Go/No-Go Readiness UI</text>
      <rect x="10" y="48" width="56" height="16" rx="3" fill="#14532d"/>
      <text x="16" y="60" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Verified</text>
    </g>

    <!-- Ticket 2 in DONE -->
    <g transform="translate(550, 126)">
      <rect width="200" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">RHA-302</text>
      <rect x="168" y="8" width="22" height="16" rx="3" fill="#1e293b"/>
      <text x="174" y="20" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">3</text>
      <text x="10" y="38" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Digital Sign-Off Trail</text>
      <rect x="10" y="48" width="56" height="16" rx="3" fill="#14532d"/>
      <text x="16" y="60" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Verified</text>
    </g>

    <!-- Ticket 3 in DONE -->
    <g transform="translate(550, 210)">
      <rect width="200" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">RHA-303</text>
      <rect x="168" y="8" width="22" height="16" rx="3" fill="#1e293b"/>
      <text x="174" y="20" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">5</text>
      <text x="10" y="38" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Release Notes Publisher</text>
      <rect x="10" y="48" width="56" height="16" rx="3" fill="#14532d"/>
      <text x="16" y="60" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Verified</text>
    </g>

    <!-- Ticket 4 in DONE -->
    <g transform="translate(550, 294)">
      <rect width="200" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">RHA-305</text>
      <rect x="168" y="8" width="22" height="16" rx="3" fill="#1e293b"/>
      <text x="174" y="20" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">3</text>
      <text x="10" y="38" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">E2E Test Suite (42 tests)</text>
      <rect x="10" y="48" width="56" height="16" rx="3" fill="#14532d"/>
      <text x="16" y="60" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Verified</text>
    </g>
  </g>

  <!-- Right: Burndown Velocity Chart -->
  <g transform="translate(805, 75)">
    <rect width="365" height="395" rx="8" fill="url(#columnBg)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">
      Sprint 3 Burndown Chart
    </text>
    <text x="20" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      24 committed story points · 10 days glidepath
    </text>

    <!-- Graph Axes & Grid -->
    <g transform="translate(35, 70)">
      <!-- Grid lines -->
      <line x1="0" y1="0" x2="300" y2="0" stroke="#334155" stroke-dasharray="3,3"/>
      <text x="-25" y="4" fill="#64748b" font-size="10" font-family="sans-serif">24</text>
      <line x1="0" y1="60" x2="300" y2="60" stroke="#334155" stroke-dasharray="3,3"/>
      <text x="-25" y="64" fill="#64748b" font-size="10" font-family="sans-serif">18</text>
      <line x1="0" y1="120" x2="300" y2="120" stroke="#334155" stroke-dasharray="3,3"/>
      <text x="-25" y="124" fill="#64748b" font-size="10" font-family="sans-serif">12</text>
      <line x1="0" y1="180" x2="300" y2="180" stroke="#334155" stroke-dasharray="3,3"/>
      <text x="-25" y="184" fill="#64748b" font-size="10" font-family="sans-serif">6</text>
      <line x1="0" y1="240" x2="300" y2="240" stroke="#475569" stroke-width="1.5"/>
      <text x="-25" y="244" fill="#64748b" font-size="10" font-family="sans-serif">0</text>

      <!-- Ideal Glidepath (Dashed Cyan) -->
      <line x1="0" y1="0" x2="300" y2="240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>

      <!-- Actual Burndown (Solid Green) -->
      <polyline points="0,0  30,0  60,30  90,30  120,60  150,60  180,110  210,140  240,220  270,240 300,240"
                fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Data points -->
      <circle cx="60" cy="30" r="4" fill="#22c55e"/>
      <circle cx="120" cy="60" r="4" fill="#22c55e"/>
      <circle cx="180" cy="110" r="4" fill="#22c55e"/>
      <circle cx="240" cy="220" r="4" fill="#22c55e"/>
      <circle cx="300" cy="240" r="5" fill="#4ade80"/>

      <!-- Days labels -->
      <text x="0" y="260" fill="#64748b" font-size="9" font-family="sans-serif">D1</text>
      <text x="60" y="260" fill="#64748b" font-size="9" font-family="sans-serif">D3</text>
      <text x="120" y="260" fill="#64748b" font-size="9" font-family="sans-serif">D5</text>
      <text x="180" y="260" fill="#64748b" font-size="9" font-family="sans-serif">D7</text>
      <text x="240" y="260" fill="#64748b" font-size="9" font-family="sans-serif">D9</text>
      <text x="290" y="260" fill="#64748b" font-size="9" font-family="sans-serif">D10</text>
    </g>

    <!-- Legend -->
    <g transform="translate(35, 355)">
      <line x1="0" y1="10" x2="20" y2="10" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="26" y="14" fill="#94a3b8" font-size="10" font-family="sans-serif">Ideal Burndown</text>

      <line x1="130" y1="10" x2="150" y2="10" stroke="#22c55e" stroke-width="2.5"/>
      <circle cx="140" cy="10" r="3" fill="#22c55e"/>
      <text x="156" y="14" fill="#94a3b8" font-size="10" font-family="sans-serif">Actual Story Points</text>
    </g>
  </g>
</svg>
